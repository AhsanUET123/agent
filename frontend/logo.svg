<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glowing cyan filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glowing red filter -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic background gradient -->
    <radialGradient id="grad-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#050812"/>
    </radialGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="100" fill="url(#grad-bg)"/>

  <!-- Radar Outer Concentric Rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.15" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="10 12" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.15" />

  <!-- Radar Crosshairs -->
  <line x1="256" y1="20" x2="256" y2="492" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.1" />
  <line x1="20" y1="256" x2="492" y2="256" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.1" />

  <!-- Crimson Threat Danger Area (Futuristic warning triangle) -->
  <polygon points="256,90 410,370 102,370" fill="none" stroke="#ff0055" stroke-width="5" filter="url(#glow-red)" stroke-linejoin="round" />
  <polygon points="256,120 380,350 132,350" fill="none" stroke="#ff0055" stroke-width="1.5" stroke-opacity="0.5" stroke-linejoin="round" />

  <!-- Tactical Nodes (Corners of target lock) -->
  <circle cx="256" cy="90" r="8" fill="#ff0055" filter="url(#glow-red)"/>
  <circle cx="410" cy="370" r="8" fill="#ff0055" filter="url(#glow-red)"/>
  <circle cx="102" cy="370" r="8" fill="#ff0055" filter="url(#glow-red)"/>

  <!-- Glowing EOC Active Pulse (Center target lock) -->
  <circle cx="256" cy="256" r="45" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow-cyan)" />
  <circle cx="256" cy="256" r="6" fill="#00ff66" filter="url(#glow-cyan)" />
  
  <!-- CIRO Acronym text in Share Tech Mono styling -->
  <text x="256" y="445" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="52" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="8" filter="url(#glow-cyan)">CIRO</text>
  <text x="256" y="480" font-family="sans-serif" font-size="14" font-weight="600" fill="#8fa2c4" text-anchor="middle" letter-spacing="4" opacity="0.7">TACTICAL SYSTEMS</text>
</svg>
